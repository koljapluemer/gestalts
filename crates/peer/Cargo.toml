[package]
name = "gestalts-peer"
description = "Storage over HTTP: another device's node, and published decks; native and wasm"
edition.workspace = true
version.workspace = true

[dependencies]
gestalts-core.workspace = true
async-trait.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "Headers"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# pairing: a client that pins the node's certificate, and finding the node again by mDNS
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
