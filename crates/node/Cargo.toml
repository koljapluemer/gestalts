[package]
name = "gestalts-node"
description = "Serves a folder of Gestalts notes on 127.0.0.1 and hosts plugin workers; apps embed it"
edition.workspace = true
version.workspace = true

[dependencies]
pollster = "0.4"
gestalts-core.workspace = true
gestalts-fs.workspace = true
gestalts-peer.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
include_dir = "0.7"
mime_guess = "2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
# the home-network listener: TLS with the node's own certificate, advertised by mDNS, paired by QR code
getrandom = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
if-addrs = "0.13"
mdns-sd = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
