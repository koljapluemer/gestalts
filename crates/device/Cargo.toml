[package]
name = "gestalts-device"
description = "A device's own folder of notes, synced with the node it paired with: the native side of the gestalter on a phone"
edition.workspace = true
version.workspace = true

[dependencies]
gestalts-core.workspace = true
gestalts-fs.workspace = true
gestalts-peer.workspace = true
serde.workspace = true
serde_json.workspace = true
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
