[package]
name = "gestalts-wasm"
description = "The gestalts core in the browser: with OPFS storage; HTTP storage comes from gestalts-peer"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gestalts-core.workspace = true
gestalts-peer.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["js"] }
futures = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Navigator", "StorageManager",
  "FileSystemHandle", "FileSystemDirectoryHandle", "FileSystemFileHandle",
  "FileSystemGetFileOptions", "FileSystemGetDirectoryOptions", "FileSystemRemoveOptions",
  "FileSystemWritableFileStream", "WritableStream", "File", "Blob",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
