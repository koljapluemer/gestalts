schema: 2
id: ollama
version: 0.1.0
host_api: 2
title: Ollama
description: Local language models on this computer, through an Ollama server, for other plugins to use.
worker:
  runtime: uv
  project: worker
  command: [python, -m, ollama_worker]
  services: [ollama@1]
  # the Ollama server: OLLAMA_HOST, else this address
  network: [127.0.0.1:11434]
