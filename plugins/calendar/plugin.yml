schema: 2
id: calendar
version: 1.0.0
host_api: 2
title: Calendar
description: Today's daily note, and appointments and recurring items by day or over a range.
uses: [daily@1, appointment@1, recurring@1]
panes:
  - { id: daily, title: Daily, entry: ui/src/index.ts#DailyPane }
  - { id: calendar, title: Calendar, entry: ui/src/index.ts#CalendarPane }
lenses:
  - { gestalt: appointment@1, entry: ui/src/index.ts#AppointmentLens }
  - { gestalt: recurring@1, entry: ui/src/index.ts#RecurringLens }
  - { gestalt: daily@1, entry: ui/src/index.ts#DailyLens }
access:
  # the daily note's [[ completion and previews reach any note
  read: all
  write: { gestalts: [daily@1, appointment@1, recurring@1] }
