id: phrasebook
version: 1.0.0
title: Phrasebook
description: >-
  Learn to say everyday things in another language: see what you want to say, say it aloud, check, rate yourself.
  Variants of a phrase (whom you speak to) share what they practise, and Progress shows what you can do across them,
  estimated from everything you practised.
tags: [learning]
# it records your attempts to play them back; recording needs the app's origin, as a sandboxed frame can't
permissions: [same-origin, microphone]
reads: [flashcard@1, fsrs-data@1, practice-session@1, practice-event@1, concept@2, concept-link@1, deck@1, source@1]
writes: [fsrs-data@1, practice-session@1, practice-event@1]
