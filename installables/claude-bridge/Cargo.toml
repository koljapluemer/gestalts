[package]
name = "gestalts-claude-bridge"
description = "Lets a website you allow run the claude CLI (Claude Code) on this computer, with the website's tools"
edition.workspace = true
version.workspace = true

[[bin]]
name = "gestalts-claude-bridge"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
png = "0.18"

# Linux: StatusNotifierItem over D-Bus, so no GTK; it runs its own thread
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# macOS/Windows: the tray (and the dialogs) need an event loop on the main thread, which tao provides
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
tao = "0.37"

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"

[package.metadata.packager]
product-name = "gestalts-claude-bridge"
identifier = "com.koljasam.gestalts-claude-bridge"
category = "DeveloperTool"
description = "Lets a website you allow run Claude Code on this computer"
icons = ["assets/icon.png"]
authors = ["Kolja Sam"]
publisher = "Kolja Sam"
before-packaging-command = "cargo build --release -p gestalts-claude-bridge"
out-dir = "../../target/packages"

[package.metadata.generate-rpm]
name = "gestalts-claude-bridge"
summary = "Lets a website you allow run Claude Code on this computer"
license = "proprietary"
assets = [
  { source = "../../target/release/gestalts-claude-bridge", dest = "/usr/bin/gestalts-claude-bridge", mode = "755" },
  { source = "assets/gestalts-claude-bridge.desktop", dest = "/usr/share/applications/gestalts-claude-bridge.desktop", mode = "644" },
  { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/gestalts-claude-bridge.png", mode = "644" },
]
