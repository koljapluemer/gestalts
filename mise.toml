# Developer tools and tasks. After cloning: `mise install`, then `mise run setup`.
# Rust itself is pinned in rust-toolchain.toml (rustup reads it).

[tools]
node = "26.12.0"
pnpm = "10.32.1"
uv = "0.13.6"
"cargo:wasm-pack" = "0.15.1"
"cargo:cargo-packager" = "0.11.8"
"cargo:cargo-generate-rpm" = "0.21.1"
"cargo:tauri-cli" = "2.12.4"

# --- the whole repo ---

[tasks.setup]
description = "JS dependencies, the core compiled to wasm (after cloning, and after changing crates/core, crates/peer or crates/wasm) and the Make agent template"
run = [
  "pnpm install",
  "wasm-pack --log-level warn build crates/wasm --target web --out-dir ../../packages/client/wasm --out-name gestalts",
  "pnpm -C apps/learning-workshop/agent-template install --ignore-workspace",
]

[tasks.check]
description = "Tests, lints, typechecks, every deck's health and the agent template's example"
depends = ["setup"]
shell = "bash -c"
run = """
set -euo pipefail
cargo test --workspace -q
cargo clippy --workspace -q -- -D warnings
pnpm lint
pnpm typecheck
pnpm test
python3 -m unittest discover -s apps/learning-workshop/tests
apps/learning-workshop/scripts/check-example.sh
for d in plugins/*/decks/*/; do cargo run -q --release -p gestalts-node-desktop -- $(bash scripts/plugin-dirs.sh) health "$d" > /dev/null; done
"""

[tasks.serve]
description = "The node headless with the repo's plugins, for working on workers without the desktop shell"
usage = 'arg "<dir>" help="the data folder (notes/ + blobs/)"'
run = "cargo run -q -p gestalts-node-desktop -- --profile dev $(bash scripts/plugin-dirs.sh) serve --data {{usage.dir}}"

[tasks.health-data]
description = "Print every yml in a data folder that can't be used, and why"
usage = 'arg "<dir>" help="the data folder (notes/ + blobs/)"'
run = "cargo run -q --release -p gestalts-node-desktop -- $(bash scripts/plugin-dirs.sh) health {{usage.dir}}"

[tasks.publish-data]
description = "Prepare a data folder for publishing as a read-only deck: content-addressed blobs, index.json, checks (after editing a plugin's deck)"
usage = 'arg "<dir>" help="the data folder, e.g. plugins/phrasebook/decks/<deck>"'
run = "cargo run -q --release -p gestalts-node-desktop -- $(bash scripts/plugin-dirs.sh) publish {{usage.dir}}"

# --- gestalts-node: the desktop app ---

[tasks."node:settings-build"]
description = "The node's settings page into apps/node/settings/dist, which the desktop app embeds"
depends = ["setup"]
run = "pnpm --dir apps/node/settings build"

[tasks."node:dev"]
description = "The desktop app (tray, the repo's plugins, dev profile) and its settings page with hot reload, on the first free ports from :5176 and :7737"
depends = ["setup"]
shell = "bash -c"
run = """
trap 'kill 0' EXIT
page="$(scripts/free-port.sh 5176)"
# in steps of two: the port after it is this node's home-network port. Clear of an installed node on 7717
node="$(scripts/free-port.sh 7737 2)"
echo "gestalts-node settings: http://localhost:$page/ on the node at :$node"
cargo run -q -p gestalts-node-desktop -- --profile dev --port "$node" --lan-port "$((node + 1))" $(bash scripts/plugin-dirs.sh) --open-url "http://localhost:$page/" &
GESTALTS_NODE="http://127.0.0.1:$node" pnpm --dir apps/node/settings dev --port "$page" --strictPort &
wait
"""

[tasks."node:package"]
description = "Desktop app installers for this OS into target/packages"
depends = ["node:settings-build"]
shell = "bash -c"
run = """
set -euo pipefail
case "$(uname -s)" in
  Linux)  cargo packager -p gestalts-node-desktop --release --formats deb,appimage
          cargo generate-rpm -p apps/node/desktop -o target/packages ;;
  Darwin) cargo packager -p gestalts-node-desktop --release --formats dmg ;;
  *)      cargo packager -p gestalts-node-desktop --release --formats nsis ;;
esac
"""

[tasks."node:install"]
description = "Build and install the desktop app on this machine, the way a user gets it"
depends = ["node:package"]
run = "bash scripts/install-package.sh target/packages"

# --- gestalter ---

[tasks."gestalter:dev"]
description = "gestalter with hot reload on the first free port from :5173, on a dev desktop app (tray, the repo's plugins) from :7737"
depends = ["setup", "node:settings-build"]
shell = "bash -c"
run = """
trap 'kill 0' EXIT
page="$(scripts/free-port.sh 5173)"
node="$(scripts/free-port.sh 7737 2)"
echo "gestalter: http://localhost:$page/ on the node at :$node (its settings: http://127.0.0.1:$node/)"
cargo run -q -p gestalts-node-desktop -- --profile dev --port "$node" --lan-port "$((node + 1))" $(bash scripts/plugin-dirs.sh) --background &
VITE_GESTALTS_NODE="http://127.0.0.1:$node" pnpm --dir apps/gestalter/distribution dev --port "$page" --strictPort --open &
wait
"""

[tasks."gestalter:build"]
description = "Production build of gestalter into apps/gestalter/distribution/dist, a static site to host anywhere"
depends = ["setup"]
run = "pnpm --dir apps/gestalter/distribution build"

# --- the Android app ---

[tasks."android:check"]
description = "Clippy on the Android app for arm64 Android (needs the NDK, see apps/gestalter/doc/android.md)"
shell = "bash -c"
run = """
set -euo pipefail
source scripts/android-env.sh
bin="$(echo "$NDK_HOME"/toolchains/llvm/prebuilt/*/bin)"
export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang" AR_aarch64_linux_android="$bin/llvm-ar"
export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
cargo clippy --manifest-path apps/node/android/Cargo.toml -q --target aarch64-linux-android -- -D warnings
"""

[tasks."android:dev"]
description = "The Android app on a connected phone or a running emulator, with the page hot-reloading from this machine; the page is $GESTALTS_ANDROID_DISTRIBUTION (default apps/gestalter/distribution-android)"
depends = ["setup"]
dir = "apps/node/android"
shell = "bash -c"
run = """
source ../../../scripts/android-env.sh
source ../../../scripts/android-distribution.sh
export GESTALTER_PAGE_PORT="$(../../../scripts/free-port.sh 5174)"
export GESTALTER_HMR_PORT="$(../../../scripts/free-port.sh $((GESTALTER_PAGE_PORT + 1)))"
cargo tauri android dev --config "$(distribution_config "http://localhost:$GESTALTER_PAGE_PORT")"
"""

[tasks."android:build"]
description = "A debug APK for arm64 phones, to install with adb, of $GESTALTS_ANDROID_DISTRIBUTION (default apps/gestalter/distribution-android)"
depends = ["setup"]
dir = "apps/node/android"
shell = "bash -c"
run = """
set -euo pipefail
source ../../../scripts/android-env.sh
source ../../../scripts/android-distribution.sh
cargo tauri android build --debug --apk --target aarch64 --config "$(distribution_config)"
ls gen/android/app/build/outputs/apk/*/debug/*.apk
"""

# --- loops-for-learning ---

[tasks."loops:dev"]
description = "The Loops app on :5174 with hot reload"
depends = ["setup"]
run = "pnpm --dir apps/loops-for-learning dev"

[tasks."loops:build"]
description = "Production build into apps/loops-for-learning/dist, static files to host anywhere"
depends = ["setup"]
run = "pnpm --dir apps/loops-for-learning build"

# --- learning-workshop ---

[tasks."workshop:dev"]
description = "The local Make node on :7727 and the learning workshop on :5175 with hot reload"
depends = ["setup"]
run = "apps/learning-workshop/scripts/dev.sh"

[tasks."workshop:app"]
description = "The learning workshop on :5175 without the local node; preview still works without an agent"
depends = ["setup"]
run = "pnpm --dir apps/learning-workshop dev"

[tasks."workshop:node"]
description = "The local Make node on :7727, using $WORKSHOP_DATA or ~/gestalt-workshop-views"
run = "apps/learning-workshop/scripts/node.sh"

[tasks."workshop:build"]
description = "Production build into apps/learning-workshop/dist"
depends = ["setup"]
run = "pnpm --dir apps/learning-workshop build"

[tasks."workshop:agent-stats"]
description = "Summarize local Make agent time, token use, cost and tool activity"
run = "python3 apps/learning-workshop/scripts/agent_stats.py"
