# --- teacher ---

[tasks."teacher:serve"]
hide = true
description = "The teacher server on :7740 (API) and :7741 (lessons), data in teacher-data/, after installing the player build (needs ANTHROPIC_API_KEY for the agent)"
depends = ["setup"]
shell = "bash -c"
run = """
set -euo pipefail
pnpm --dir apps/player build
cargo run -q -p gestalts-teacher -- --data teacher-data admin install-player --dist apps/player/dist
cargo run -q -p gestalts-teacher -- --data teacher-data serve --insecure-cookies
"""

[tasks."teacher:app"]
hide = true
description = "The teacher app on :5178 with hot reload, its /api from the teacher server (mise run teacher:serve)"
depends = ["setup"]
run = "pnpm --dir apps/teacher dev"

[tasks."teacher:agent"]
hide = true
description = "A node on :7757 that runs the claude CLI for the teacher app (its settings: Claude on this computer); TEACHER_AGENT_ORIGIN allows a deployed app"
depends = ["setup"]
run = "apps/teacher/scripts/agent-node.sh"

[tasks."teacher:admin"]
hide = true
description = "Schools and teachers on the local teacher server: mise run teacher:admin add-school NAME, add-teacher --school ID --email E"
run = "cargo run -q -p gestalts-teacher -- --data teacher-data admin"

[tasks."teacher:deploy"]
hide = true
description = "Build the teacher server, app and player and ship them to TEACHER_HOST (deploy/teacher/README.md; needs a committed tree)"
depends = ["setup"]
run = "bash scripts/deploy-teacher.sh"
