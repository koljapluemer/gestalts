name: practice-session
version: 1
description: One practice session in one view (`app`). Written by one device only, under a random id.
fields:
  app: { type: string, required: true }
  started: { type: datetime, required: true }
  ended: { type: datetime }
  active_ms: { type: integer, min: 0 }
  trials: { type: integer, min: 0 }
  events:
    type: list
    items:
      type: map
      fields:
        at: { type: datetime, required: true }
merge:
  keys:
    events: { union_by: at }
    active_ms: max
    trials: max
    ended: max
