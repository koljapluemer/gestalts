name: conflict
version: 1
description: >-
  A value two sides of a sync changed differently that no merge rule settled, in the yml `of`, at `path`. The yml keeps
  `kept`; `lost` is the other side. A missing `base`, `kept` or `lost` was absent there; `raw` means they are whole
  texts. Resolving it writes the chosen value into the yml and deletes this one.
fields:
  of: { type: ref, required: true }
  path: { type: list, required: true }
  raw: { type: bool }
  recorded: { type: datetime, required: true }
  base: { type: any }
  kept: { type: any }
  lost: { type: any }
merge:
  keys:
    recorded: min
