name: concept-link
version: 1
description: >-
  A claim that evidence about the concept `from` says something about the concept `to`, by `weight` from 0 (nothing) to
  1 (as much as about `from` itself). Directed: knowing how to say a word is good evidence of recognising it, not the
  other way round, so that's two links of different weights. Cycles are fine; there's no hierarchy. `kind` is a hint
  for people and LLMs reading the graph ("part-of", "similar", "contrasts"), never something a model relies on.
  `source` says who claims it (a deck, "user", a model), so several claims about one pair can stand side by side.
fields:
  from: { type: ref, required: true, targets: [concept] }
  to: { type: ref, required: true, targets: [concept] }
  weight: { type: number, required: true, min: 0, max: 1 }
  kind: { type: string }
  source: { type: string }
