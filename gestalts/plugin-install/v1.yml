name: plugin-install
version: 1
description: >-
  A plugin installed in this folder: `plugin` (its id), where it came from (`source`: `built-in`, or a URL later),
  the `version` installed, whether it's `enabled`, and `decks`: those switched off (`{<deck id>: false}`). Keyed `stableId("plugin", id)`. Uninstalling deletes the note.
requires_tags: [plugin-install]
fields:
  plugin: { type: string, required: true }
  source: { type: string, required: true }
  version: { type: string }
  enabled: { type: bool }
  decks: { type: map }
