name: plugin-install
version: 1
description: >-
  A plugin installed in this folder. `decks` holds those switched off, as `{<deck id>: false}`. Uninstalling deletes
  it.
fields:
  plugin: { type: string, required: true }
  source: { type: string, required: true }
  version: { type: string }
  enabled: { type: bool }
  decks: { type: map }
