name: fsrs-data
version: 1
description: >-
  A learner's spaced-repetition state for the yml in `target`, as a ts-fsrs card. With `facet`, for that one facet of
  it. Kept apart from what is reviewed, which may be read-only. Id: `stateId("fsrs-data", target, facet)`.
fields:
  target: { type: ref, required: true }
  facet: { type: string }
  model: { type: string, required: true }
  last_rating: { type: integer, required: true, one_of: [1, 2, 3, 4] }
  card:
    type: map
    required: true
    fields:
      dueAt: { type: datetime, required: true }
      lastReviewAt: { type: datetime }
      stability: { type: number, required: true }
      stabilityFast: { type: number }
      difficulty: { type: number, required: true }
      state: { type: integer, required: true, one_of: [0, 1, 2, 3] }
      scheduleStatus: { type: string }
      reps: { type: integer, required: true, min: 0 }
      lapses: { type: integer, required: true, min: 0 }
      scheduledDays: { type: number }
      learningStep: { type: integer, min: 0 }
merge:
  whole: { newest_by: [card.lastReviewAt, card.reps] }
