name: concept
version: 1
description: >-
  Something that can be learned, in any domain. `practiced-by` maps the ymls that practice this concept, of any
  gestalt, to how strongly each does, from 0 to 1. What a concept means inside a domain, and how a strength is
  computed, belongs to the deck or view that creates it.
fields:
  name: { type: string, required: true }
  parents: { type: ref_list, targets: [concept] }
  children: { type: ref_list, targets: [concept] }
  practiced-by: { type: ref_map, min: 0, max: 1 }
