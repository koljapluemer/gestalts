name: flag
version: 1
description: >-
  One country's flag to name, of the kind its `model` makes: `country` is its ISO 3166 alpha-2 code, `name` what it is
  called on the answer, `image` the flag (an SVG blob). A wrong option is drawn from `lookalikes` (codes of flags it is
  confused with), else `distractors` (its region's countries), else any other flag. `concepts` maps the concepts it
  practises to how strongly, from 0 to 1, and `chance` is how often a guess is right.
fields:
  model: { type: ref, required: true, targets: [item-model] }
  country: { type: string, required: true }
  name: { type: string, required: true }
  image: { type: blob, required: true }
  lookalikes: { type: string_list }
  distractors: { type: string_list }
  concepts: { type: ref_map, min: 0, max: 1, targets: [concept] }
  chance: { type: number, min: 0, max: 1 }
  tags: { type: string_list }
  sources: { type: relationships, targets: [source] }
