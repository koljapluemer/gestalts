name: map-exercise
version: 1
description: >-
  One exercise on a map about one region, `country` (its code in the map's geometry), of the kind its `model` makes
  (`find-in-neighborhood`, `find-on-world-map`, `identify-country`, `distractor-choice`, `group-sequence`). `zoom` is
  how close it starts (100 the world, 175 the country filling the view), `distractors` the codes a wrong option is
  drawn from, `group` the country group it is a step of, `priority` how much to prefer it (1 most, 3 least).
  `concepts` maps the concepts it practises to how strongly, from 0 to 1, and `chance` is how often a guess is right.
fields:
  model: { type: ref, required: true, targets: [item-model] }
  country: { type: string, required: true }
  group: { type: ref, targets: [country-group] }
  zoom: { type: number, min: 0 }
  distractors: { type: string_list }
  priority: { type: integer, min: 1, max: 3 }
  concepts: { type: ref_map, min: 0, max: 1, targets: [concept] }
  chance: { type: number, min: 0, max: 1 }
  tags: { type: string_list }
  sources: { type: relationships, targets: [source] }
