[package]
name = "gestalts-node-desktop"
description = "gestalts-node on the desktop: a folder on this computer as the source of truth for the gestalts apps, in a tray, with its settings page and the plugins' workers"
edition.workspace = true
version.workspace = true

[[bin]]
name = "gestalts-node"
path = "src/main.rs"

[dependencies]
gestalts-node.workspace = true
clap = { version = "4", features = ["derive"] }
# the same version as the node's, whose `Embedded` takes these `Dir`s
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json.workspace = true
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
opener = "0.9"

# Linux: StatusNotifierItem over D-Bus, so no GTK/appindicator; it runs its own thread, no event loop needed
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# macOS/Windows: the tray needs an event loop on the main thread, which tao provides
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
tao = "0.37"

[package.metadata.packager]
product-name = "gestalts-node"
identifier = "com.koljasam.gestalts-node"
category = "Productivity"
description = "Your ymls in a folder on this computer, synced with your devices, for the gestalts apps"
icons = ["assets/icon.png"]
authors = ["Kolja Sam"]
publisher = "Kolja Sam"
before-packaging-command = "cargo build --release -p gestalts-node-desktop"
out-dir = "../../../target/packages"


[package.metadata.generate-rpm]
name = "gestalts-node"
summary = "Your ymls in a folder on this computer, synced with your devices, for the gestalts apps"
license = "proprietary"
assets = [
  { source = "../../../target/release/gestalts-node", dest = "/usr/bin/gestalts-node", mode = "755" },
  { source = "assets/gestalts-node.desktop", dest = "/usr/share/applications/gestalts-node.desktop", mode = "644" },
  { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/gestalts-node.png", mode = "644" },
]

# the desktop app's earlier names (the .deb can't say so: uninstall those by hand); the settings
# (`gestalts/config.json`) are the node's and stay
[package.metadata.generate-rpm.obsoletes]
gestalter = "*"
gestalts-connector = "*"
