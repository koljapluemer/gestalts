# Its own workspace: Tauri pulls in webkit2gtk on a Linux host, which the desktop app (the root workspace) avoids.
[workspace]

[package]
name = "gestalter-android"
description = "The gestalter on Android: the page in a WebView, the notes in the app's storage, synced with the paired desktop"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
name = "gestalter_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
gestalts-device = { path = "../../../crates/device" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-barcode-scanner = "2.5.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
